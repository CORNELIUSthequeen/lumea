<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LUMEA | Manage Products</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b0b;
            color: #f5f0e8;
            font-family: Georgia, "Times New Roman", serif;
            min-height: 100vh;
        }

        header {
            padding: 25px 7%;
            border-bottom: 1px solid #c9a45c;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #c9a45c;
            font-size: 28px;
            letter-spacing: 7px;
        }

        .back {
            color: #aaa;
            text-decoration: none;
        }

        .back:hover {
            color: #c9a45c;
        }

        .container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 25px;
        }

        h1 {
            color: #c9a45c;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 35px;
        }

        .product-list {
            display: grid;
            gap: 20px;
        }

        .product {
            background: #151515;
            border: 1px solid rgba(201, 164, 92, 0.4);
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .product-info h2 {
            color: #c9a45c;
            margin-bottom: 8px;
        }

        .product-info p {
            color: #aaa;
        }

        button {
            padding: 12px 18px;
            background: #5a0f1b;
            color: #f5f0e8;
            border: 1px solid #c9a45c;
            cursor: pointer;
            font-family: inherit;
        }

        button:hover {
            background: #c9a45c;
            color: #0b0b0b;
        }

        .add-button {
            margin-bottom: 30px;
            padding: 14px 25px;
            font-size: 16px;
            letter-spacing: 1px;
        }

        .delete-button {
            margin-left: 10px;
        }

        #message {
            margin-bottom: 20px;
            color: #c9a45c;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #c9a45c;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            background: #151515;
            color: #f5f0e8;
            border: 1px solid #c9a45c;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
        }

        #add-product-form {
            background: #111;
            border: 1px solid rgba(201, 164, 92, 0.4);
            padding: 25px;
            margin-bottom: 30px;
        }

        .variation-box {
            background: #151515;
            border: 1px solid rgba(201, 164, 92, 0.4);
            padding: 20px;
            margin-top: 15px;
        }

        .variation-title {
            color: #c9a45c;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .remove-variation {
            margin-top: 5px;
        }

        .help-text {
            color: #aaa;
            margin-top: 8px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .product {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">LUMEA</div>

    <a href="admin-dashboard.html" class="back">
        ← Dashboard
    </a>

</header>

<main class="container">

    <h1>MANAGE PRODUCTS</h1>

    <p class="subtitle">
        Add, edit and remove products from your LUMEA store.
    </p>

    <button class="add-button" id="add-product">
        + ADD PRODUCT
    </button>

    <div id="add-product-form" style="display: none;">

        <div class="form-group">
            <label>Product Name</label>

            <input
                type="text"
                id="new-product-name"
                placeholder="e.g. Pearl Bracelet"
            >
        </div>

        <div class="form-group">
            <label>Price</label>

            <input
                type="number"
                id="new-product-price"
                placeholder="15000"
            >
        </div>

        <div class="form-group">
            <label>Product Description</label>

            <textarea
                id="new-product-description"
                placeholder="Describe your product..."
                rows="4"
            ></textarea>
        </div>

        <div class="form-group">
            <label>Product Category</label>

            <select id="new-product-category">
                <option value="">Select a category</option>
                <option value="Necklaces">Necklaces</option>
                <option value="Bracelets">Bracelets</option>
                <option value="Earrings">Earrings</option>
                <option value="Rings">Rings</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label>Stock Status</label>

            <select id="new-product-stock">
                <option value="true">In Stock</option>
                <option value="false">Sold Out</option>
            </select>
        </div>

        <div class="form-group">

            <label>Product Images</label>

            <input
                type="file"
                id="new-product-images"
                accept="image/*"
                multiple
            >

            <p class="help-text">
                Select multiple images for the product.
            </p>

        </div>


        <!-- VARIATIONS -->

        <div class="form-group">

            <label>Product Variations</label>

            <div id="variation-container"></div>

            <button
                type="button"
                id="add-variation"
            >
                + ADD VARIATION
            </button>

            <p class="help-text">
                Add any options you want, such as Gold, Silver,
                Rose Gold, Pink, Black, Small, Medium or Large.
            </p>

        </div>


        <button type="button" id="save-product">
            SAVE PRODUCT
        </button>

    </div>

    <div id="message"></div>

    <div
        class="product-list"
        id="product-list"
    ></div>

</main>


<script type="module">

import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://jkkyovlduvxvmwyptkva.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_HTXhXhQFZzH6s31rkFWWPw_YcUSAKQw";


const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


// ============================
// CHECK LOGIN
// ============================

async function checkLogin() {

    const {
        data: { session }
    } =
        await supabase.auth.getSession();


    if (!session) {

        window.location.href =
            "admin.html";

    }
}


// ============================
// VARIATIONS
// ============================

const variationContainer =
    document.getElementById(
        "variation-container"
    );


const addVariationButton =
    document.getElementById(
        "add-variation"
    );


addVariationButton.addEventListener(
    "click",
    function() {

        const variationBox =
            document.createElement("div");


        variationBox.className =
            "variation-box";


        variationBox.innerHTML = `

            <div class="variation-title">
                Variation
            </div>

            <div class="form-group">

                <label>Variation Name</label>

                <input
                    type="text"
                    class="variation-name"
                    placeholder="e.g. Gold"
                >

            </div>


            <div class="form-group">

                <label>Variation Images</label>

                <input
                    type="file"
                    class="variation-images"
                    accept="image/*"
                    multiple
                >

            </div>


            <div class="form-group">

                <label>Stock Status</label>

                <select class="variation-stock">

                    <option value="true">
                        In Stock
                    </option>

                    <option value="false">
                        Sold Out
                    </option>

                </select>

            </div>


            <button
                type="button"
                class="remove-variation"
            >
                REMOVE VARIATION
            </button>

        `;


        variationBox
            .querySelector(
                ".remove-variation"
            )
            .addEventListener(
                "click",
                function() {

                    variationBox.remove();

                }
            );


        variationContainer.appendChild(
            variationBox
        );

    }
);


// ============================
// LOAD PRODUCTS
// ============================

async function loadProducts() {

    const {
        data,
        error
    } =
        await supabase
            .from("products")
            .select("*")
            .order(
                "id",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(error);

        document
            .getElementById("message")
            .textContent =
                "Could not load products.";

        return;
    }


    const list =
        document.getElementById(
            "product-list"
        );


    list.innerHTML = "";


    data.forEach(product => {

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "product";


        div.innerHTML = `

            <div class="product-info">

                <h2>
                    ${product.name}
                </h2>

                <p>
                    ₦${Number(
                        product.price
                    ).toLocaleString()}
                </p>

            </div>


            <div>

                <button
                    onclick="editProduct('${product.id}')"
                >
                    EDIT
                </button>


                <button
                    class="delete-button"
                    onclick="deleteProduct('${product.id}')"
                >
                    DELETE
                </button>

            </div>

        `;


        list.appendChild(div);

    });

}


// ============================
// EDIT PRODUCT
// ============================

window.editProduct =
async function(id) {

    const {
        data: product,
        error: fetchError
    } =
        await supabase
            .from("products")
            .select("*")
            .eq("id", id)
            .single();


    if (fetchError) {

        console.error(fetchError);

        alert(
            "Could not load product."
        );

        return;
    }


    const newName =
        prompt(
            "Product name:",
            product.name
        );


    if (newName === null)
        return;


    const newPrice =
        prompt(
            "Product price:",
            product.price
        );


    if (newPrice === null)
        return;


    const inStock =
        confirm(
            "Is this product in stock?\n\nOK = In Stock\nCancel = Sold Out"
        );


    if (
        !newName.trim() ||
        !newPrice.trim()
    ) {

        alert(
            "Please enter a name and price."
        );

        return;
    }


    const changeImage =
        confirm(
            "Do you want to change the product image?\n\nOK = Choose a new image\nCancel = Keep current image"
        );


    let imageURL =
        product.image;


    if (changeImage) {

        const fileInput =
            document.createElement(
                "input"
            );


        fileInput.type =
            "file";


        fileInput.accept =
            "image/*";


        const imageFile =
            await new Promise(
                resolve => {

                    fileInput.onchange =
                        () => {

                            resolve(
                                fileInput
                                    .files[0] ||
                                null
                            );

                        };


                    fileInput.click();

                }
            );


        if (imageFile) {

            const fileExtension =
                imageFile.name
                    .split(".")
                    .pop();


            const fileName =
                `${Date.now()}-${Math.random()
                    .toString(36)
                    .substring(2)}.${fileExtension}`;


            const {
                error: uploadError
            } =
                await supabase.storage
                    .from(
                        "product-images"
                    )
                    .upload(
                        fileName,
                        imageFile
                    );


            if (uploadError) {

                console.error(
                    uploadError
                );

                alert(
                    "Could not upload the new image."
                );

                return;
            }


            const {
                data: publicURL
            } =
                supabase.storage
                    .from(
                        "product-images"
                    )
                    .getPublicUrl(
                        fileName
                    );


            imageURL =
                publicURL.publicUrl;

        }

    }


    const {
        data: updatedProduct,
        error
    } =
        await supabase
            .from("products")
            .update({

                name:
                    newName.trim(),

                price:
                    Number(newPrice),

                image:
                    imageURL,

                in_stock:
                    inStock

            })
            .eq("id", id)
            .select(
                "id, in_stock"
            );


    console.log(
        "ID being updated:",
        id
    );

    console.log(
        "Sent to Supabase:",
        inStock
    );

    console.log(
        "Supabase returned:",
        updatedProduct
    );

    console.log(
        "Update error:",
        error
    );


    if (error) {

        console.error(error);

        alert(
            "Could not update product."
        );

        return;
    }


    alert(
        "Product updated successfully!"
    );


    loadProducts();

};


// ============================
// DELETE PRODUCT
// ============================

window.deleteProduct =
async function(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this product?"
        );


    if (!confirmed)
        return;


    const {
        error
    } =
        await supabase
            .from("products")
            .delete()
            .eq("id", id);


    if (error) {

        alert(
            "Could not delete product."
        );

        console.error(error);

        return;
    }


    loadProducts();

};


// ============================
// SHOW / HIDE ADD FORM
// ============================

document
    .getElementById(
        "add-product"
    )
    .addEventListener(
        "click",
        function() {

            const form =
                document.getElementById(
                    "add-product-form"
                );


            if (
                form.style.display ===
                "none"
            ) {

                form.style.display =
                    "block";

            } else {

                form.style.display =
                    "none";

            }

        }
    );


// ============================
// ADD PRODUCT
// ============================

document
    .getElementById(
        "save-product"
    )
    .addEventListener(
        "click",
        async function() {

            const name =
                document
                    .getElementById(
                        "new-product-name"
                    )
                    .value
                    .trim();


            const price =
                document
                    .getElementById(
                        "new-product-price"
                    )
                    .value;


            const description =
                document
                    .getElementById(
                        "new-product-description"
                    )
                    .value
                    .trim();


            const category =
                document
                    .getElementById(
                        "new-product-category"
                    )
                    .value;


            const inStock =
                document
                    .getElementById(
                        "new-product-stock"
                    )
                    .value ===
                "true";


            const imageFiles =
                Array.from(
                    document
                        .getElementById(
                            "new-product-images"
                        )
                        .files
                );


            if (
                !name ||
                !price ||
                imageFiles.length === 0
            ) {

                alert(
                    "Please enter a product name, price, and at least one image."
                );

                return;
            }


            // ============================
            // UPLOAD PRODUCT IMAGES
            // ============================

            const uploadedImageURLs =
                [];


            for (
                const imageFile
                of imageFiles
            ) {

                const fileExtension =
                    imageFile.name
                        .split(".")
                        .pop();


                const fileName =
                    `${Date.now()}-${Math.random()
                        .toString(36)
                        .substring(2)}.${fileExtension}`;


                const {
                    error: uploadError
                } =
                    await supabase.storage
                        .from(
                            "product-images"
                        )
                        .upload(
                            fileName,
                            imageFile
                        );


                if (uploadError) {

                    console.error(
                        uploadError
                    );

                    alert(
                        "Could not upload one of the images."
                    );

                    return;
                }


                const {
                    data: publicURL
                } =
                    supabase.storage
                        .from(
                            "product-images"
                        )
                        .getPublicUrl(
                            fileName
                        );


                uploadedImageURLs.push(
                    publicURL.publicUrl
                );

            }


            // ============================
            // CREATE PRODUCT
            // ============================

            const {
                data: newProduct,
                error
            } =
                await supabase
                    .from("products")
                    .insert([
                        {

                            name:
                                name,

                            price:
                                Number(price),

                            image:
                                uploadedImageURLs[0],

                            description:
                                description,

                            category:
                                category,

                            in_stock:
                                inStock

                        }
                    ])
                    .select()
                    .single();


            if (error) {

                console.error(error);

                alert(
                    "Could not add the product."
                );

                return;
            }


            // ============================
            // SAVE PRODUCT IMAGES
            // ============================

            const imageRows =
                uploadedImageURLs.map(
                    (
                        url,
                        index
                    ) => ({

                        product_id:
                            newProduct.id,

                        image_url:
                            url,

                        display_order:
                            index

                    })
                );


            if (
                imageRows.length > 0
            ) {

                const {
                    error:
                        imagesError
                } =
                    await supabase
                        .from(
                            "product images"
                        )
                        .insert(
                            imageRows
                        );


                if (imagesError) {

                    console.error(
                        imagesError
                    );

                    alert(
                        "Product was created, but the images could not be saved."
                    );

                    return;
                }

            }


            // ============================
            // SAVE VARIATIONS
            // ============================

            const variationBoxes =
                Array.from(
                    document.querySelectorAll(
                        "#variation-container > div"
                    )
                );


            for (
                const variationBox
                of variationBoxes
            ) {

                const variationName =
                    variationBox
                        .querySelector(
                            ".variation-name"
                        )
                        .value
                        .trim();


                const variationStock =
                    variationBox
                        .querySelector(
                            ".variation-stock"
                        )
                        .value ===
                    "true";


                const variationFiles =
                    Array.from(
                        variationBox
                            .querySelector(
                                ".variation-images"
                            )
                            .files
                    );


                if (!variationName) {

                    alert(
                        "Please enter a name for every variation."
                    );

                    return;
                }


                const variationImageURLs =
                    [];


                for (
                    const imageFile
                    of variationFiles
                ) {

                    const fileExtension =
                        imageFile.name
                            .split(".")
                            .pop();


                    const fileName =
                        `${Date.now()}-${Math.random()
                            .toString(36)
                            .substring(2)}.${fileExtension}`;


                    const {
                        error:
                            uploadError
                    } =
                        await supabase.storage
                            .from(
                                "product-images"
                            )
                            .upload(
                                fileName,
                                imageFile
                            );


                    if (
                        uploadError
                    ) {

                        console.error(
                            uploadError
                        );

                        alert(
                            `Could not upload images for ${variationName}.`
                        );

                        return;
                    }


                    const {
                        data:
                            publicURL
                    } =
                        supabase.storage
                            .from(
                                "product-images"
                            )
                            .getPublicUrl(
                                fileName
                            );


                    variationImageURLs.push(
                        publicURL.publicUrl
                    );

                }


                const {
                    error:
                        variationError
                } =
                    await supabase
                        .from(
                            "product variations"
                        )
                        .insert([
                            {

                                product_id:
                                    newProduct.id,

                                name:
                                    variationName,

                                images:
                                    variationImageURLs,

                                in_stock:
                                    variationStock

                            }
                        ]);


                if (
                    variationError
                ) {

                    console.error(
                        variationError
                    );

                    alert(
                        `Could not save the ${variationName} variation.`
                    );

                    return;
                }

            }


            // ============================
            // CLEAR FORM
            // ============================

            document
                .getElementById(
                    "new-product-name"
                )
                .value = "";


            document
                .getElementById(
                    "new-product-price"
                )
                .value = "";


            document
                .getElementById(
                    "new-product-description"
                )
                .value = "";


            document
                .getElementById(
                    "new-product-category"
                )
                .value = "";


            document
                .getElementById(
                    "new-product-images"
                )
                .value = "";


            document
                .getElementById(
                    "variation-container"
                )
                .innerHTML = "";


            document
                .getElementById(
                    "add-product-form"
                )
                .style.display =
                    "none";


            alert(
                "Product added successfully!"
            );


            loadProducts();

        }
    );


// ============================
// START PAGE
// ============================

checkLogin();

loadProducts();

</script>

</body>
</html>
