<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LUMEA | Wear Your Light</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, "Times New Roman", serif;
            background-color: #0b0b0b;
            color: #f5f0e8;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 7%;
            border-bottom: 1px solid #c9a45c;
        }

        .logo {
            color: #c9a45c;
            font-size: 30px;
            letter-spacing: 8px;
        }

        nav a {
            color: #f5f0e8;
            text-decoration: none;
            margin-left: 30px;
            font-size: 15px;
        }

        nav a:hover {
            color: #c9a45c;
        }

        .hero {
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(
                rgba(11, 11, 11, 0.7),
                rgba(90, 15, 27, 0.5)
            );
        }

        .hero h1 {
            color: #c9a45c;
            font-size: clamp(60px, 12vw, 130px);
            letter-spacing: 20px;
            margin-left: 20px;
        }

        .hero p {
            margin-top: 20px;
            letter-spacing: 6px;
            font-size: 16px;
        }

        .hero button {
            margin-top: 40px;
            padding: 15px 35px;
            background-color: #5a0f1b;
            color: #f5f0e8;
            border: 1px solid #c9a45c;
            cursor: pointer;
            font-family: inherit;
            font-size: 15px;
            letter-spacing: 2px;
        }

        .hero button:hover {
            background-color: #c9a45c;
            color: #0b0b0b;
        }

        .section {
            padding: 80px 7%;
            text-align: center;
        }

        .section h2 {
            color: #c9a45c;
            font-size: 35px;
            margin-bottom: 20px;
            letter-spacing: 4px;
        }

        .section p {
            color: #ddd;
            max-width: 600px;
            margin: auto;
            line-height: 1.8;
        }
        .section-intro{
            margin-bottom: 45px !important;
        }
        .products {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    max-width: 850px;
    margin: 0 auto;
}

.product-card {
    background-color: #151515;
    border: 1px solid rgba(201, 164, 92, 0.4);
    padding: 10px;
    transition: transform 0.3s ease;
}

.product-card:hover {
    transform: translateY(-8px);
}

.product-image {
    width: 160px;
    height: 160px;
    background-color: #242124;
    overflow: hidden;
    margin: 0 auto 20px;
    border-radius: 50%;
    border: 2px solid #c9a45c;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.product-card h3 {
    color: #f5f0e8;
    font-size: 20px;
    margin-bottom: 10px;
}

.price {
    color: #c9a45c !important;
    font-size: 18px;
    margin-bottom: 20px !important;
}

.product-card button {
    padding: 12px 25px;
    background-color: #5a0f1b;
    color: #f5f0e8;
    border: 1px solid #c9a45c;
    cursor: pointer;
    font-family: inherit;
}

.product-card button:hover {
    background-color: #c9a45c;
    color: #0b0b0b;
}

        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid #c9a45c;
            color: #c9a45c;
        }
        /* MOBILE RESPONSIVE DESIGN */

@media (max-width: 600px) {

    header {
        padding: 18px 15px;
        flex-direction: column;
        gap: 18px;
    }

    .logo {
        font-size: 25px;
        letter-spacing: 6px;
    }

    nav {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
    }

    nav a {
        margin-left: 0;
        font-size: 14px;
    }

    .hero {
        min-height: 70vh;
        padding: 50px 20px;
    }

    .hero h1 {
        font-size: clamp(45px, 16vw, 75px);
        letter-spacing: 10px;
        margin-left: 10px;
    }

    .hero p {
        font-size: 13px;
        letter-spacing: 4px;
    }

    .hero button {
        padding: 14px 28px;
    }

    .section {
        padding: 55px 15px;
    }

    .section h2 {
        font-size: 27px;
        letter-spacing: 3px;
    }

    .section-intro {
        font-size: 14px;
        line-height: 1.7;
        margin-bottom: 30px !important;
    }

    .category-filters {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-bottom: 30px;
    }

    .category-filter {
        margin: 0;
        padding: 9px 13px;
        font-size: 13px;
    }

    .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        width: 100%;
    }

    .product-card {
        padding: 10px;
        width: 100%;
    }

    .product-image {
        width: 120px;
        height: 120px;
        margin-bottom: 15px;
    }

    .product-card h3 {
        font-size: 16px;
    }

    .product-card p {
        font-size: 13px;
    }

    .price {
        font-size: 16px;
    }

    .product-card button {
        width: 100%;
        padding: 10px 8px;
        font-size: 12px;
    }

    footer {
        padding: 25px 15px;
        font-size: 13px;
    }
}
        /* ============================
           PRODUCT DETAILS MODAL
        ============================ */

        .product-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            overflow-y: auto;
            padding: 30px 15px;
        }

        .product-modal-content {
            position: relative;
            max-width: 850px;
            margin: 30px auto;
            background: #111;
            border: 1px solid #c9a45c;
            padding: 30px;
        }

        .close-product-modal {
            position: absolute;
            top: 10px;
            right: 15px;
            background: transparent;
            border: none;
            color: #c9a45c;
            font-size: 35px;
            padding: 0;
            z-index: 5;
        }

        .close-product-modal:hover {
            background: transparent;
            color: #f5f0e8;
        }

        .product-gallery {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-gallery img {
            width: 100%;
            max-height: 600px;
            object-fit: contain;
            display: block;
        }

        .gallery-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 45px;
            height: 45px;
            padding: 0;
            border-radius: 50%;
            background: rgba(11, 11, 11, 0.8);
            color: #c9a45c;
            border: 1px solid #c9a45c;
            font-size: 32px;
            line-height: 1;
            z-index: 2;
        }

        .gallery-arrow:hover {
            background: #c9a45c;
            color: #0b0b0b;
        }

        #previous-image {
            left: 10px;
        }

        #next-image {
            right: 10px;
        }

        .product-image-counter {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
        }

        .product-modal-info h2 {
            color: #c9a45c;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .product-modal-info .price {
            color: #f5f0e8;
            font-size: 22px;
            margin: 15px 0;
        }

        .product-modal-info .description {
            color: #aaa;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .product-variations {
            margin: 25px 0;
        }

        .variation-label {
            color: #c9a45c;
            display: block;
            margin-bottom: 12px;
        }

        .variation-option {
            margin-right: 8px;
            margin-bottom: 8px;
            background: transparent;
            border: 1px solid #c9a45c;
            color: #f5f0e8;
        }

        .variation-option.selected {
            background: #c9a45c;
            color: #0b0b0b;
        }

        #modal-add-to-cart {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            font-size: 16px;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {

            .product-modal {
                padding: 10px;
            }

            .product-modal-content {
                margin: 10px auto;
                padding: 20px;
            }

            .product-modal-info h2 {
                font-size: 24px;
            }

            .product-gallery img {
                max-height: 450px;
            }

        }
    </style>
</head>

<body>

    <header>
        <div class="logo">LUMEA</div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Shop</a>
            <a href="#">About</a>
            <a href="#">♡</a>
            <a href="cart.html">🛒</a>
        </nav>
    </header>

    <section class="hero">
        <h1>LUMEA</h1>

        <p>WEAR YOUR LIGHT.</p>

        <button>SHOP NOW</button>
    </section>

    <section class="section">
    <h2>NEW ARRIVALS</h2>

    <p class="section-intro">
        Discover our latest pieces, thoughtfully selected to
        bring elegance to every moment.
    </p>
    <div class="category-filters">
    <button class="category-filter active" data-category="all">
        All
    </button>

    <button class="category-filter" data-category="Necklaces">
        Necklaces
    </button>

    <button class="category-filter" data-category="Bracelets">
        Bracelets
    </button>

    <button class="category-filter" data-category="Earrings">
        Earrings
    </button>

    <button class="category-filter" data-category="Rings">

    </button>

    <button class="category-filter" data-category="Other">
        Other
    </button>
</div>

   <div class="products" id="products-container">
</div>
</section>

    <footer>
        LUMEA · WEAR YOUR LIGHT.
    </footer>
<script src="cart.js"></script>
<script type="module">

    import { createClient } from
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
        "https://jkkyovlduvxvmwyptkva.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_HTXhXhQFZzH6s31rkFWWPw_YcUSAKQw";

    const supabase = createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

    async function loadStoreProducts() {

        const { data, error } =
            await supabase
                .from("products")
                .select("*")
                .order("id", { ascending: true });

        if (error) {
            console.error("Could not load products:", error);
            return;
        }

        const container =
            document.getElementById("products-container");

        container.innerHTML = "";

        data.forEach(product => {

            const card =
                document.createElement("div");

            card.className = "product-card";

      card.innerHTML = `
    <div class="product-image">
        <img
            src="${product.image}"
            alt="${product.name}"
        >
    </div>

    <h3>${product.name}</h3>

    <p class="category">
        ${product.category || ""}
    </p>

    <p class="stock-status ${product.in_stock ? "in-stock" : "sold-out"}">
        ${product.in_stock ? "In Stock" : "Sold Out"}
    </p>

    <p class="description">
        ${product.description || ""}
    </p>

    <p class="price">
        ₦${Number(product.price).toLocaleString()}
    </p>

    <button
        class="view-product-button"
        type="button"
    >
        VIEW PRODUCT
    </button>
`;
card.addEventListener("click", function(event) {

    if (
        event.target.closest("button")
    ) {
        return;
    }

    openProductDetails(product);

});
            container.appendChild(card);
        });
    }

    loadStoreProducts();
document.querySelectorAll(".category-filter").forEach(button => {

    button.addEventListener("click", () => {

        const selectedCategory =
            button.dataset.category;

        document
            .querySelectorAll(".category-filter")
            .forEach(btn => {
                btn.classList.remove("active");
            });

        button.classList.add("active");

        document
            .querySelectorAll(".product-card")
            .forEach(card => {

                const category =
                    card.querySelector(".category")
                        ?.textContent
                        .trim();

                if (
                    selectedCategory === "all" ||
                    category === selectedCategory
                ) {
                    card.style.display = "";
                } else {
                    card.style.display = "none";
                }
            });
    });
});
// ============================
// LUMEA PRODUCT DETAILS
// ============================

let currentProduct = null;
let currentImages = [];
let currentImageIndex = 0;


// ============================
// OPEN PRODUCT DETAILS
// ============================

window.openProductDetails = async function(product) {

    currentProduct = product;
    currentImageIndex = 0;

    const modal =
        document.getElementById("product-modal");

    document.getElementById(
        "modal-product-name"
    ).textContent = product.name;

    document.getElementById(
        "modal-product-category"
    ).textContent = product.category || "";

    document.getElementById(
        "modal-product-price"
    ).textContent =
        `₦${Number(product.price).toLocaleString()}`;

    document.getElementById(
        "modal-product-description"
    ).textContent =
        product.description || "";

    const stockElement =
        document.getElementById("modal-product-stock");

    stockElement.textContent =
        product.in_stock
            ? "In Stock"
            : "Sold Out";

    stockElement.className =
        `stock-status ${
            product.in_stock
                ? "in-stock"
                : "sold-out"
        }`;


    // ============================
    // LOAD PRODUCT IMAGES
    // ============================

    const {
        data: imageData,
        error: imageError
    } = await supabase
        .from("product images")
        .select("*")
        .eq("product_id", product.id)
        .order("display_order", {
            ascending: true
        });


    if (imageError) {

        console.error(
            "Could not load product images:",
            imageError
        );

        currentImages = [product.image];

    } else {

        currentImages =
            imageData &&
            imageData.length > 0
                ? imageData.map(
                    image => image.image_url
                  )
                : [product.image];

    }


    // ============================
    // LOAD VARIATIONS
    // ============================

    const {
        data: variations,
        error: variationError
    } = await supabase
        .from("product variations")
        .select("*")
        .eq("product_id", product.id);


    if (variationError) {

        console.error(
            "Could not load variations:",
            variationError
        );

    }


    const variationContainer =
        document.getElementById(
            "modal-product-variations"
        );

    variationContainer.innerHTML = "";


    if (
        variations &&
        variations.length > 0
    ) {

        const label =
            document.createElement("span");

        label.className =
            "variation-label";

        label.textContent =
            "Choose an option:";

        variationContainer.appendChild(label);


        variations.forEach(variation => {

            const button =
                document.createElement("button");

            button.type = "button";

            button.className =
                "variation-option";

            button.textContent =
                variation.name;


          button.addEventListener(
    "click",
    function() {

        document
            .querySelectorAll(
                ".variation-option"
            )
            .forEach(btn => {

                btn.classList.remove(
                    "selected"
                );

            });


        button.classList.add(
            "selected"
        );


        currentImages =
            Array.isArray(variation.images)
                ? variation.images
                : [];


        if (currentImages.length === 0) {

            currentImages =
                [product.image];

        }


        currentImageIndex = 0;


        updateProductImage();

    }
);


            variationContainer.appendChild(
                button
            );

        });

    }


    updateProductImage();


    document.getElementById(
        "modal-add-to-cart"
    ).disabled =
        !product.in_stock;


    modal.style.display = "block";

    document.body.style.overflow = "hidden";

};


// ============================
// UPDATE IMAGE
// ============================

function updateProductImage() {

    const image =
        document.getElementById(
            "modal-product-image"
        );

    const counter =
        document.getElementById(
            "product-image-counter"
        );


    if (
        !currentImages ||
        currentImages.length === 0
    ) {

        image.src = "";

        counter.textContent = "";

        return;

    }


    image.src =
        currentImages[
            currentImageIndex
        ];

    image.alt =
        currentProduct.name;


    counter.textContent =
        `${currentImageIndex + 1} / ${currentImages.length}`;

};


// ============================
// NEXT IMAGE
// ============================

document
    .getElementById("next-image")
    .addEventListener(
        "click",
        function() {

            if (
                currentImages.length === 0
            ) {
                return;
            }


            currentImageIndex =
                (
                    currentImageIndex + 1
                ) %
                currentImages.length;


            updateProductImage();

        }
    );


// ============================
// PREVIOUS IMAGE
// ============================

document
    .getElementById("previous-image")
    .addEventListener(
        "click",
        function() {

            if (
                currentImages.length === 0
            ) {
                return;
            }


            currentImageIndex =
                (
                    currentImageIndex -
                    1 +
                    currentImages.length
                ) %
                currentImages.length;


            updateProductImage();

        }
    );


// ============================
// CLOSE MODAL
// ============================

document
    .getElementById("close-product-modal")
    .addEventListener(
        "click",
        function() {

            document.getElementById(
                "product-modal"
            ).style.display = "none";

            document.body.style.overflow = "";

        }
    );


// ============================
// CLOSE OUTSIDE MODAL
// ============================

document
    .getElementById("product-modal")
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                this.style.display =
                    "none";

                document.body.style.overflow =
                    "";

            }

        }
    );


// ============================
// SWIPE IMAGES ON PHONE
// ============================

let touchStartX = 0;
let touchEndX = 0;

const gallery =
    document.querySelector(
        ".product-gallery"
    );


gallery.addEventListener(
    "touchstart",
    function(event) {

        touchStartX =
            event.changedTouches[0]
                .screenX;

    }
);


gallery.addEventListener(
    "touchend",
    function(event) {

        touchEndX =
            event.changedTouches[0]
                .screenX;


        const difference =
            touchStartX -
            touchEndX;


        if (
            Math.abs(difference) < 50
        ) {
            return;
        }


        if (difference > 0) {

            document
                .getElementById(
                    "next-image"
                )
                .click();

        } else {

            document
                .getElementById(
                    "previous-image"
                )
                .click();

        }

    }
);
</script>
<!-- PRODUCT DETAILS MODAL -->

<div id="product-modal" class="product-modal">

    <div class="product-modal-content">

        <button
            id="close-product-modal"
            class="close-product-modal"
        >
            ×
        </button>


        <div class="product-gallery">

            <button
                id="previous-image"
                class="gallery-arrow"
            >
                ‹
            </button>


            <img
                id="modal-product-image"
                src=""
                alt=""
            >


            <button
                id="next-image"
                class="gallery-arrow"
            >
                ›
            </button>

        </div>


        <div
            id="product-image-counter"
            class="product-image-counter"
        ></div>


        <div class="product-modal-info">

            <h2 id="modal-product-name"></h2>

            <p
                id="modal-product-category"
                class="category"
            ></p>

            <p
                id="modal-product-price"
                class="price"
            ></p>

            <p
                id="modal-product-description"
                class="description"
            ></p>


            <div
                id="modal-product-variations"
                class="product-variations"
            ></div>


            <p
                id="modal-product-stock"
                class="stock-status"
            ></p>


            <button
                id="modal-add-to-cart"
            >
                ADD TO CART
            </button>

        </div>

    </div>

</div>
</body>
</html>
