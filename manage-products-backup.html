<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LUMEA | Manage Products</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b0b;
            color: #f5f0e8;
            font-family: Georgia, "Times New Roman", serif;
            min-height: 100vh;
        }

        header {
            padding: 25px 7%;
            border-bottom: 1px solid #c9a45c;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #c9a45c;
            font-size: 28px;
            letter-spacing: 7px;
        }

        .back {
            color: #aaa;
            text-decoration: none;
        }

        .back:hover {
            color: #c9a45c;
        }

        .container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 25px;
        }

        h1 {
            color: #c9a45c;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 35px;
        }

        .product-list {
            display: grid;
            gap: 20px;
        }

        .product {
            background: #151515;
            border: 1px solid rgba(201, 164, 92, 0.4);
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .product-info h2 {
            color: #c9a45c;
            margin-bottom: 8px;
        }

        .product-info p {
            color: #aaa;
        }

        button {
            padding: 12px 18px;
            background: #5a0f1b;
            color: #f5f0e8;
            border: 1px solid #c9a45c;
            cursor: pointer;
            font-family: inherit;
        }

        button:hover {
            background: #c9a45c;
            color: #0b0b0b;
        }

        .add-button {
            margin-bottom: 30px;
            padding: 14px 25px;
            font-size: 16px;
            letter-spacing: 1px;
        }

        .delete-button {
            margin-left: 10px;
        }

        #message {
            margin-bottom: 20px;
            color: #c9a45c;
        }

        @media (max-width: 600px) {
            .product {
                flex-direction: column;
                align-items: flex-start;
            }
        }
        #new-product-category {
    display: block;
    width: 100%;
    padding: 12px;
    background: #151515;
    color: #f5f0e8;
    border: 1px solid #c9a45c;
    cursor: pointer;
    position: relative;
    z-index: 100;
}
    </style>
</head>

<body>

    <header>

        <div class="logo">LUMEA</div>

        <a href="admin-dashboard.html" class="back">
            ← Dashboard
        </a>

    </header>

    <main class="container">

        <h1>MANAGE PRODUCTS</h1>

        <p class="subtitle">
            Add, edit and remove products from your LUMEA store.
        </p>

        <button class="add-button" id="add-product">
    + ADD PRODUCT
</button>

<div id="add-product-form" style="display: none;">

    <div class="form-group">
        <label>Product Name</label>
        <input
            type="text"
            id="new-product-name"
            placeholder="e.g. Pearl Bracelet"
        >
    </div>

    <div class="form-group">
        <label>Price</label>
        <input
            type="number"
            id="new-product-price"
            placeholder="15000"
        >
    </div>
<div class="form-group">
    <label>Product Description</label>

    <textarea
        id="new-product-description"
        placeholder="Describe your product..."
        rows="4"
    ></textarea>
</div>
<div class="form-group">
    <label>Product Category</label>

    <select id="new-product-category">
        <option value="">Select a category</option>
        <option value="Necklaces">Necklaces</option>
        <option value="Bracelets">Bracelets</option>
        <option value="Earrings">Earrings</option>
        <option value="Rings">Rings</option>
        <option value="Other">Other</option>
    </select>
</div>
<div class="form-group">
    <label>Stock Status</label>

    <select id="new-product-stock">
        <option value="true">In Stock</option>
        <option value="false">Sold Out</option>
    </select>
</div>
    <div class="form-group">
        <label>Image Path</label>
        <input
            type="file"
            id="new-product-image"
            placeholder="image/*"
        >
    </div>

    <button type="button" id="save-product">
        SAVE PRODUCT
    </button>

</div>

        <div id="message"></div>

        <div class="product-list" id="product-list"></div>

    </main>

    <script type="module">

        import { createClient } from
        "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

        const SUPABASE_URL =
            "https://jkkyovlduvxvmwyptkva.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_HTXhXhQFZzH6s31rkFWWPw_YcUSAKQw";

        const supabase = createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        async function checkLogin() {

            const { data: { session } } =
                await supabase.auth.getSession();

            if (!session) {
                window.location.href = "admin.html";
            }
        }

        async function loadProducts() {

            const { data, error } =
                await supabase
                    .from("products")
                    .select("*")
                    .order("id", { ascending: true });

            if (error) {

                console.error(error);

                document.getElementById("message").textContent =
                    "Could not load products.";

                return;
            }

            const list =
                document.getElementById("product-list");

            list.innerHTML = "";

            data.forEach(product => {

                const div =
                    document.createElement("div");

                div.className = "product";

                div.innerHTML = `
                    <div class="product-info">
                        <h2>${product.name}</h2>
                        <p>₦${Number(product.price).toLocaleString()}</p>
                    </div>

                    <div>
                        <button onclick="editProduct('${product.id}')">
                            EDIT
                        </button>

                        <button
                            class="delete-button"
                            onclick="deleteProduct('${product.id}')">
                            DELETE
                        </button>
                    </div>
                `;

                list.appendChild(div);
            });
        }

    window.editProduct = async function(id) {

    const { data: product, error: fetchError } =
        await supabase
            .from("products")
            .select("*")
            .eq("id", id)
            .single();

    if (fetchError) {
        console.error(fetchError);
        alert("Could not load product.");
        return;
    }

    const newName =
        prompt("Product name:", product.name);

    if (newName === null) return;

    const newPrice =
        prompt("Product price:", product.price);

    if (newPrice === null) return;

    const inStock = confirm(
        "Is this product in stock?\n\nOK = In Stock\nCancel = Sold Out"
    );

    console.log("Stock value being saved:", inStock);

    if (!newName.trim() || !newPrice.trim()) {
        alert("Please enter a name and price.");
        return;
    }

    // Ask whether the user wants to change the image
    const changeImage = confirm(
        "Do you want to change the product image?\n\nOK = Choose a new image\nCancel = Keep current image"
    );

    let imageURL = product.image;

    if (changeImage) {

        const fileInput = document.createElement("input");

        fileInput.type = "file";
        fileInput.accept = "image/*";

        const imageFile = await new Promise(resolve => {

            fileInput.onchange = () => {
                resolve(fileInput.files[0] || null);
            };

            fileInput.click();
        });

        if (imageFile) {

            const fileExtension =
                imageFile.name.split(".").pop();

            const fileName =
                `${Date.now()}-${Math.random().toString(36).substring(2)}.${fileExtension}`;

            const { error: uploadError } =
                await supabase.storage
                    .from("product-images")
                    .upload(fileName, imageFile);

            if (uploadError) {

                console.error(uploadError);

                alert("Could not upload the new image.");

                return;
            }

            const { data: publicURL } =
                supabase.storage
                    .from("product-images")
                    .getPublicUrl(fileName);

            imageURL = publicURL.publicUrl;
        }
    }

    // Update the product
    const { data, error } =
        await supabase
            .from("products")
            .update({
                name: newName.trim(),
                price: Number(newPrice),
                image: imageURL,
                in_stock: instock
            })
            .eq("id", id)
            .select();

    console.log("UPDATED PRODUCT:", data);
    console.log("UPDATE ERROR:", error);

    if (error) {

        console.error(error);

        alert("Could not update product.");

        return;
    }

    alert("Product updated successfully!");

    loadProducts();
};
window.deleteProduct = async function(id) {

            const confirmed =
                confirm("Are you sure you want to delete this product?");

            if (!confirmed) return;

            const { error } =
                await supabase
                    .from("products")
                    .delete()
                    .eq("id", id);

            if (error) {

                alert("Could not delete product.");

                console.error(error);

                return;
            }

            loadProducts();
        };

        document
            .getElementById("add-product")
            .addEventListener("click", function() {

                alert(
                    "We'll build the Add Product form next."
                );

            });

        checkLogin();
        loadProducts();
document.getElementById("add-product").addEventListener(
    "click",
    function () {

        const form = document.getElementById("add-product-form");

        if (form.style.display === "none") {
            form.style.display = "block";
        } else {
            form.style.display = "none";
        }

    }
);


document.getElementById("save-product").addEventListener(
    "click",
    async function () {

        const name =
            document.getElementById("new-product-name").value.trim();

        const price =
            document.getElementById("new-product-price").value;
const description =
    document.getElementById("new-product-description").value.trim();
    const category =
    document.getElementById("new-product-category").value;
    const inStock =
    document.getElementById("new-product-stock").value === "true";
        const imageFile =
            document.getElementById("new-product-image").files[0];
document.getElementById("new-product-description").value = "";
document.getElementById("new-product-category").value = "";
        if (!name || !price || !imageFile) {
            alert("Please enter a product name, price, and image.");
            return;
        }

        const fileExtension =
            imageFile.name.split(".").pop();

        const fileName =
            `${Date.now()}.${fileExtension}`;

        const { error: uploadError } =
            await supabase.storage
                .from("product-images")
                .upload(fileName, imageFile);

        if (uploadError) {

            console.error(uploadError);

            alert("Could not upload the image.");

            return;
        }

        const { data: publicURL } =
            supabase.storage
                .from("product-images")
                .getPublicUrl(fileName);

        const imageURL =
            publicURL.publicUrl;

        const { error } =
            await supabase
                .from("products")
                .insert([
                    {
                        name: name,
                        price: Number(price),
                        image: imageURL,
                        description:description,
                        category:category,
                        in_stock: instock
                    }
                ]);

        if (error) {

            console.error(error);

            alert("Could not add the product.");

            return;
        }

        alert("Product added successfully!");

        document.getElementById("new-product-name").value = "";
        document.getElementById("new-product-price").value = "";
        document.getElementById("new-product-image").value = "";

        document.getElementById("add-product-form").style.display =
            "none";

        loadProducts();
    }
);
    </script>

</body>
</html>
